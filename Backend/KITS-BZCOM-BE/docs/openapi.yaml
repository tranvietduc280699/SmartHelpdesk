"openapi": "3.0.3"
"info":
  "title": "Smart Helpdesk CRM — Swagger đầy đủ"
  "version": "1.0.0"
  "description": "Đối chiếu source ngày 2026-09-12. 25 handler nghiệp vụ / 29 method-path (4 alias auth). JSON UTF-8; UUID dạng chuỗi; Instant ISO-8601 UTC. ResponseGeneral bỏ field null ở cấp envelope. HTTP 201 vẫn có body.status=200. Lỗi Spring Security filter không bảo đảm envelope ApiError. AI chạy RuleBasedLlmAdapter nội bộ, không gọi API LLM bên ngoài."
"servers":
  -
    "url": "http://localhost:8080"
    "description": "Local; đổi host/port theo môi trường"
"tags":
  -
    "name": "Auth"
  -
    "name": "Members"
  -
    "name": "Companies"
  -
    "name": "Requests"
  -
    "name": "AI"
  -
    "name": "Alerts"
  -
    "name": "Chat"
"security":
  -
    "bearerAuth": []
"paths":
  "/api/auth/login":
    "post":
      "tags":
        - "Auth"
      "summary": "Đăng nhập"
      "operationId": "login"
      "description": "Quyền: Public. Trả accessToken và refreshToken. Access mặc định 86400000 ms, refresh gấp 7 lần; phụ thuộc cấu hình."
      "x-access": "Public"
      "responses":
        "200":
          "description": "Thành công."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/loginResponse"
              "example":
                "status": 200
                "message": "Login successful"
                "data":
                  "accessToken": "<accessToken>"
                  "refreshToken": "<refreshToken>"
                  "user":
                    "id": "0198f101-1234-7000-8000-000000000001"
                    "email": "client@example.com"
                    "name": "Nguyễn Văn An"
                    "role": "ADMIN"
                    "phone": "Ví dụ"
                    "companyId": "COMPANY001"
                    "companyName": "Công ty mẫu"
                    "status": "active"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "500":
          "$ref": "#/components/responses/Error500"
      "security": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/LoginRequest"
            "example":
              "email": "client@example.com"
              "password": "Example123!"
  "/api/auth/register":
    "post":
      "tags":
        - "Auth"
      "summary": "Đăng ký tài khoản"
      "operationId": "register"
      "description": "Quyền: Public. Email đã tồn tại trả BAD_400. companyId không tồn tại trả RES_404."
      "x-access": "Public"
      "responses":
        "201":
          "description": "Tạo thành công; body.status=200."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/registerResponse"
              "example":
                "status": 200
                "message": "Member registered successfully"
                "data":
                  "id": "0198f101-1234-7000-8000-000000000001"
                  "email": "client@example.com"
                  "name": "Nguyễn Văn An"
                  "role": "ADMIN"
                  "phone": "Ví dụ"
                  "companyId": "COMPANY001"
                  "companyName": "Công ty mẫu"
                  "status": "active"
                  "isDeleted": false
                  "createdAt": "2026-09-12T03:00:00Z"
        "400":
          "$ref": "#/components/responses/Error400"
        "404":
          "$ref": "#/components/responses/Error404"
        "500":
          "$ref": "#/components/responses/Error500"
      "security": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/RegisterRequest"
            "example":
              "email": "client@example.com"
              "password": "Example123!"
              "name": "Nguyễn Văn An"
              "role": "CLIENT"
              "phone": "0900000000"
              "companyId": "COMPANY001"
  "/api/auth/refresh":
    "post":
      "tags":
        - "Auth"
      "summary": "Làm mới token"
      "operationId": "refresh"
      "description": "Quyền: Public. Refresh token chỉ dùng một lần; xoay vòng cả hai token. Store trong bộ nhớ nên mất khi restart."
      "x-access": "Public"
      "responses":
        "200":
          "description": "Thành công."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/refreshResponse"
              "example":
                "status": 200
                "message": "Token refreshed successfully"
                "data":
                  "accessToken": "<accessToken>"
                  "refreshToken": "<refreshToken>"
                  "accessTokenTtl": 86400000
                  "refreshTokenTtl": 604800000
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "500":
          "$ref": "#/components/responses/Error500"
      "security": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/TokenRefreshRequest"
            "example":
              "refreshToken": "<refreshToken>"
      "parameters":
        -
          "name": "User-Agent"
          "in": "header"
          "required": false
          "schema":
            "type": "string"
          "description": "Thiếu/rỗng dùng UNKNOWN_DEVICE. Trình duyệt tự quản lý header này."
  "/api/auth/logout":
    "post":
      "tags":
        - "Auth"
      "summary": "Đăng xuất"
      "operationId": "logout"
      "description": "Quyền: Public. Không body. Có bearer hợp lệ: thu hồi toàn bộ refresh token của user; không thu hồi access token. Không gửi bearer vẫn trả thành công. Response không có data."
      "x-access": "Public"
      "responses":
        "200":
          "description": "Thành công."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/logoutResponse"
              "example":
                "status": 200
                "message": "Logout successful"
        "500":
          "$ref": "#/components/responses/Error500"
      "security":
        - {}
        -
          "bearerAuth": []
  "/api/v1/auth/login":
    "post":
      "tags":
        - "Auth"
      "summary": "Đăng nhập"
      "operationId": "loginV1"
      "description": "Quyền: Public. Trả accessToken và refreshToken. Access mặc định 86400000 ms, refresh gấp 7 lần; phụ thuộc cấu hình."
      "x-access": "Public"
      "responses":
        "200":
          "description": "Thành công."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/loginV1Response"
              "example":
                "status": 200
                "message": "Login successful"
                "data":
                  "accessToken": "<accessToken>"
                  "refreshToken": "<refreshToken>"
                  "user":
                    "id": "0198f101-1234-7000-8000-000000000001"
                    "email": "client@example.com"
                    "name": "Nguyễn Văn An"
                    "role": "ADMIN"
                    "phone": "Ví dụ"
                    "companyId": "COMPANY001"
                    "companyName": "Công ty mẫu"
                    "status": "active"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "500":
          "$ref": "#/components/responses/Error500"
      "security": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/LoginRequest"
            "example":
              "email": "client@example.com"
              "password": "Example123!"
  "/api/v1/auth/register":
    "post":
      "tags":
        - "Auth"
      "summary": "Đăng ký tài khoản"
      "operationId": "registerV1"
      "description": "Quyền: Public. Email đã tồn tại trả BAD_400. companyId không tồn tại trả RES_404."
      "x-access": "Public"
      "responses":
        "201":
          "description": "Tạo thành công; body.status=200."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/registerV1Response"
              "example":
                "status": 200
                "message": "Member registered successfully"
                "data":
                  "id": "0198f101-1234-7000-8000-000000000001"
                  "email": "client@example.com"
                  "name": "Nguyễn Văn An"
                  "role": "ADMIN"
                  "phone": "Ví dụ"
                  "companyId": "COMPANY001"
                  "companyName": "Công ty mẫu"
                  "status": "active"
                  "isDeleted": false
                  "createdAt": "2026-09-12T03:00:00Z"
        "400":
          "$ref": "#/components/responses/Error400"
        "404":
          "$ref": "#/components/responses/Error404"
        "500":
          "$ref": "#/components/responses/Error500"
      "security": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/RegisterRequest"
            "example":
              "email": "client@example.com"
              "password": "Example123!"
              "name": "Nguyễn Văn An"
              "role": "CLIENT"
              "phone": "0900000000"
              "companyId": "COMPANY001"
  "/api/v1/auth/refresh":
    "post":
      "tags":
        - "Auth"
      "summary": "Làm mới token"
      "operationId": "refreshV1"
      "description": "Quyền: Public. Refresh token chỉ dùng một lần; xoay vòng cả hai token. Store trong bộ nhớ nên mất khi restart."
      "x-access": "Public"
      "responses":
        "200":
          "description": "Thành công."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/refreshV1Response"
              "example":
                "status": 200
                "message": "Token refreshed successfully"
                "data":
                  "accessToken": "<accessToken>"
                  "refreshToken": "<refreshToken>"
                  "accessTokenTtl": 86400000
                  "refreshTokenTtl": 604800000
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "500":
          "$ref": "#/components/responses/Error500"
      "security": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/TokenRefreshRequest"
            "example":
              "refreshToken": "<refreshToken>"
      "parameters":
        -
          "name": "User-Agent"
          "in": "header"
          "required": false
          "schema":
            "type": "string"
          "description": "Thiếu/rỗng dùng UNKNOWN_DEVICE. Trình duyệt tự quản lý header này."
  "/api/v1/auth/logout":
    "post":
      "tags":
        - "Auth"
      "summary": "Đăng xuất"
      "operationId": "logoutV1"
      "description": "Quyền: Public. Không body. Có bearer hợp lệ: thu hồi toàn bộ refresh token của user; không thu hồi access token. Không gửi bearer vẫn trả thành công. Response không có data."
      "x-access": "Public"
      "responses":
        "200":
          "description": "Thành công."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/logoutV1Response"
              "example":
                "status": 200
                "message": "Logout successful"
        "500":
          "$ref": "#/components/responses/Error500"
      "security":
        - {}
        -
          "bearerAuth": []
  "/api/members":
    "post":
      "tags":
        - "Members"
      "summary": "Đăng ký member"
      "operationId": "registerMember"
      "description": "Quyền: Public. Cùng nghiệp vụ với /api/auth/register."
      "x-access": "Public"
      "responses":
        "201":
          "description": "Tạo thành công; body.status=200."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/registerMemberResponse"
              "example":
                "status": 200
                "message": "Member registered successfully"
                "data":
                  "id": "0198f101-1234-7000-8000-000000000001"
                  "email": "client@example.com"
                  "name": "Nguyễn Văn An"
                  "role": "ADMIN"
                  "phone": "Ví dụ"
                  "companyId": "COMPANY001"
                  "companyName": "Công ty mẫu"
                  "status": "active"
                  "isDeleted": false
                  "createdAt": "2026-09-12T03:00:00Z"
        "400":
          "$ref": "#/components/responses/Error400"
        "404":
          "$ref": "#/components/responses/Error404"
        "500":
          "$ref": "#/components/responses/Error500"
      "security": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/RegisterRequest"
            "example":
              "email": "client@example.com"
              "password": "Example123!"
              "name": "Nguyễn Văn An"
              "role": "CLIENT"
              "phone": "0900000000"
              "companyId": "COMPANY001"
    "get":
      "tags":
        - "Members"
      "summary": "Danh sách member"
      "operationId": "listMembers"
      "description": "Quyền: ADMIN. Không phân trang; findAll gồm cả member có isDeleted=true."
      "x-access": "ADMIN"
      "responses":
        "200":
          "description": "Thành công."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/listMembersResponse"
              "example":
                "status": 200
                "message": "success"
                "data": []
        "403":
          "$ref": "#/components/responses/SecurityDenied"
        "500":
          "$ref": "#/components/responses/Error500"
  "/api/members/{id}":
    "get":
      "tags":
        - "Members"
      "summary": "Chi tiết member"
      "operationId": "getMember"
      "description": "Quyền: Đã đăng nhập. Không kiểm tra chủ sở hữu hoặc cùng công ty."
      "x-access": "Đã đăng nhập"
      "responses":
        "200":
          "description": "Thành công."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/getMemberResponse"
              "example":
                "status": 200
                "message": "success"
                "data":
                  "id": "0198f101-1234-7000-8000-000000000001"
                  "email": "client@example.com"
                  "name": "Nguyễn Văn An"
                  "role": "ADMIN"
                  "phone": "Ví dụ"
                  "companyId": "COMPANY001"
                  "companyName": "Công ty mẫu"
                  "status": "active"
                  "isDeleted": false
                  "createdAt": "2026-09-12T03:00:00Z"
        "403":
          "$ref": "#/components/responses/SecurityDenied"
        "404":
          "$ref": "#/components/responses/Error404"
        "500":
          "$ref": "#/components/responses/Error500"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "description": "ID tài nguyên UUID."
          "schema":
            "type": "string"
            "format": "uuid"
            "example": "0198f101-1234-7000-8000-000000000001"
  "/api/companies":
    "get":
      "tags":
        - "Companies"
      "summary": "Danh sách công ty"
      "operationId": "listCompanies"
      "description": "Quyền: Public. Sắp xếp companyName rồi ID tăng dần; không phân trang."
      "x-access": "Public"
      "responses":
        "200":
          "description": "Thành công."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/listCompaniesResponse"
              "example":
                "status": 200
                "message": "success"
                "data": []
        "500":
          "$ref": "#/components/responses/Error500"
      "security": []
  "/api/companies/{companyId}":
    "get":
      "tags":
        - "Companies"
      "summary": "Chi tiết công ty"
      "operationId": "getCompany"
      "description": "Quyền: Đã đăng nhập."
      "x-access": "Đã đăng nhập"
      "responses":
        "200":
          "description": "Thành công."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/getCompanyResponse"
              "example":
                "status": 200
                "message": "success"
                "data":
                  "companyId": "COMPANY001"
                  "companyName": "Công ty mẫu"
                  "address": "Ví dụ"
                  "phone": "Ví dụ"
        "403":
          "$ref": "#/components/responses/SecurityDenied"
        "404":
          "$ref": "#/components/responses/Error404"
        "500":
          "$ref": "#/components/responses/Error500"
      "parameters":
        -
          "name": "companyId"
          "in": "path"
          "required": true
          "description": "Mã công ty, không phải UUID."
          "schema":
            "type": "string"
            "example": "COMPANY001"
  "/api/requests":
    "post":
      "tags":
        - "Requests"
      "summary": "Tạo yêu cầu hỗ trợ"
      "operationId": "createRequest"
      "description": "Quyền: CLIENT. Client phải có companyId. Tạo PENDING, chưa gán developer, ghi CREATE history và gửi alert cho admin (HIGH_PRIORITY_REGISTERED nếu HIGH, còn lại REQUEST_REGISTERED)."
      "x-access": "CLIENT"
      "responses":
        "201":
          "description": "Tạo thành công; body.status=200."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/createRequestResponse"
              "example":
                "status": 200
                "message": "Request created successfully"
                "data":
                  "id": "0198f101-1234-7000-8000-000000000001"
                  "companyId": "COMPANY001"
                  "companyName": "Công ty mẫu"
                  "title": "Không đăng nhập được"
                  "description": "Ví dụ"
                  "category": "BUG"
                  "priority": "HIGH"
                  "status": "PENDING"
                  "clientId": "0198f101-1234-7000-8000-000000000001"
                  "clientName": "Ví dụ"
                  "assignedDeveloperId": "0198f101-1234-7000-8000-000000000001"
                  "assignedDeveloperName": "Ví dụ"
                  "createdAt": "2026-09-12T03:00:00Z"
                  "updatedAt": "2026-09-12T03:00:00Z"
        "400":
          "$ref": "#/components/responses/Error400"
        "403":
          "$ref": "#/components/responses/SecurityDenied"
        "404":
          "$ref": "#/components/responses/Error404"
        "500":
          "$ref": "#/components/responses/Error500"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CreateRequestDto"
            "example":
              "title": "Không đăng nhập được"
              "description": "Ứng dụng báo error khi đăng nhập."
              "category": "BUG"
              "priority": "MEDIUM"
    "get":
      "tags":
        - "Requests"
      "summary": "Danh sách yêu cầu"
      "operationId": "listRequests"
      "description": "Quyền: Đã đăng nhập. ADMIN xem tất cả; CLIENT chỉ request mình tạo; DEVELOPER chỉ request được giao. Bộ lọc kết hợp AND. search tìm title/description không phân biệt hoa thường, trim khoảng trắng; % và _ giữ wildcard SQL LIKE. page âm, size <= 0, sortBy không hợp lệ hoặc lỗi chuyển kiểu query/path có thể vào SYS_500."
      "x-access": "Đã đăng nhập"
      "responses":
        "200":
          "description": "Thành công."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/listRequestsResponse"
              "example":
                "status": 200
                "message": "success"
                "data":
                  "content": []
                  "pageable":
                    "pageNumber": 0
                    "pageSize": 0
                    "sort":
                      "empty": false
                      "sorted": false
                      "unsorted": false
                    "offset": 0
                    "paged": false
                    "unpaged": false
                  "totalPages": 0
                  "totalElements": 0
                  "last": false
                  "size": 0
                  "number": 0
                  "sort":
                    "empty": false
                    "sorted": false
                    "unsorted": false
                  "numberOfElements": 0
                  "first": false
                  "empty": false
        "403":
          "$ref": "#/components/responses/SecurityDenied"
        "500":
          "$ref": "#/components/responses/Error500"
      "parameters":
        -
          "name": "category"
          "in": "query"
          "required": false
          "schema":
            "$ref": "#/components/schemas/RequestCategory"
          "description": "Lọc loại yêu cầu"
        -
          "name": "priority"
          "in": "query"
          "required": false
          "schema":
            "$ref": "#/components/schemas/RequestPriority"
          "description": "Lọc ưu tiên"
        -
          "name": "status"
          "in": "query"
          "required": false
          "schema":
            "$ref": "#/components/schemas/RequestStatus"
          "description": "Lọc trạng thái"
        -
          "name": "search"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
          "description": "Tìm title hoặc description"
        -
          "name": "page"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "default": 0
            "minimum": 0
          "description": "Trang bắt đầu từ 0"
        -
          "name": "size"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "default": 10
            "minimum": 1
          "description": "Số bản ghi/trang; chưa giới hạn tối đa"
        -
          "name": "sortBy"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "default": "createdAt"
          "description": "Thuộc tính entity Request: createdAt, updatedAt, title, priority, status..."
        -
          "name": "sortDir"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "default": "desc"
          "description": "asc không phân biệt hoa thường là tăng; mọi giá trị khác dùng giảm"
  "/api/requests/stats":
    "get":
      "tags":
        - "Requests"
      "summary": "Thống kê yêu cầu"
      "operationId": "requestStats"
      "description": "Quyền: ADMIN. Tổng số, số DONE, tỷ lệ hoàn thành, số theo category và developer chưa xóa."
      "x-access": "ADMIN"
      "responses":
        "200":
          "description": "Thành công."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/requestStatsResponse"
              "example":
                "status": 200
